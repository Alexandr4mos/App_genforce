<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Genforce Manutenções</title>
    <meta name="description" content="Ordens de serviço e manutenção de geradores — Genforce Energia" />
    <!-- Splash / chrome inicial = fundo da marca; runtime pode sobrescrever via aplicarChromeWeb -->
    <meta name="theme-color" content="#0B0D12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Genforce" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      /* Preenche a tela no PWA standalone (incl. safe areas no Android/iOS) */
      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
      }
      html {
        background-color: #0B0D12;
      }
      body {
        margin: 0;
        background-color: #0B0D12;
      }
      #root {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        background-color: #0B0D12;
        /* Fundo do app preenche notch, status e nav */
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <noscript>É necessário habilitar JavaScript para usar o Genforce Manutenções.</noscript>
    <!-- Expo SPA root (Metro injeta o bundle) -->
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              // Busca atualização em cada visita (deploy novo no Vercel)
              registration.update().catch(function () {});
              registration.addEventListener('updatefound', function () {
                var novo = registration.installing;
                if (!novo) return;
                novo.addEventListener('statechange', function () {
                  if (novo.state === 'installed' && navigator.serviceWorker.controller) {
                    // Nova versão pronta — ativa na próxima abertura (skipWaiting no SW)
                    console.log('[PWA] Nova versão disponível');
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('[PWA] Service worker não registrado:', err);
            });
        });
      }
    </script>
  </body>
</html>
