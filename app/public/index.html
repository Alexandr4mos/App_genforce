<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Genforce Manutenções</title>
    <meta name="description" content="Ordens de serviço e manutenção de geradores — Genforce Energia" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Genforce" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
      }
      html {
        background-color: #0B0D12;
      }
      body {
        margin: 0;
        background-color: #0B0D12;
      }
      #root {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        background-color: #0B0D12;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }
      /* Primeiro paint: evita tela vazia até o React montar a splash */
      #splash-boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B0D12;
        pointer-events: none;
      }
      #splash-boot img {
        width: 30vw;
        max-width: 180px;
        min-width: 96px;
        height: auto;
        aspect-ratio: 1;
        border-radius: 22%;
        object-fit: cover;
        background: #0B0D12;
      }
    </style>
  </head>
  <body>
    <noscript>É necessário habilitar JavaScript para usar o Genforce Manutenções.</noscript>
    <div id="splash-boot" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="192" height="192" />
    </div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              registration.update().catch(function () {});
              registration.addEventListener('updatefound', function () {
                var novo = registration.installing;
                if (!novo) return;
                novo.addEventListener('statechange', function () {
                  if (novo.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] Nova versão disponível');
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('[PWA] Service worker não registrado:', err);
            });
        });
      }
    </script>
  </body>
</html>
